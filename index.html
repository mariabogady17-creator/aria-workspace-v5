<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#121216" />
    <meta name="google" content="notranslate" />
    <meta name="description" content="A.R.I.A Workspace - Sistema operativo de IA con asistente inteligente, creación de documentos, agentes autónomos y productividad avanzada." />
    <link rel="manifest" href="/manifest.json" />
    <title>A.R.I.A Workspace OS</title>
    <link rel="preconnect" href="https://aria-workspace-v5-production.up.railway.app" />
  </head>
  <body>
    <main id="root"></main>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('SW registered:', reg.scope);
          }).catch(function(err) {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
